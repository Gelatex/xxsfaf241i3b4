<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Falun Rykten 2 – 8-bit ryktesmaskin</title>
    <style>
        * {
            box-sizing: border-box;
            image-rendering: pixelated;
            font-family: 'Courier New', monospace;
        }
        body {
            background: #0a0f0a;
            margin: 0;
            padding: 16px;
            color: #b3ffaa;
        }
        /* Layout: 3 kolumner */
        .app-layout {
            display: flex;
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Vänster sidofält – progress bar */
        .left-sidebar {
            width: 200px;
            background: #1a2a1a;
            border: 3px solid #5f9e5f;
            padding: 16px 8px;
            text-align: center;
            height: fit-content;
            position: sticky;
            top: 16px;
        }
        /* Mitten – huvudinnehåll */
        .main-content {
            flex: 1;
            background: #1a2a1a;
            border: 3px solid #5f9e5f;
            padding: 16px;
        }
        /* Höger sidofält – shop */
        .right-sidebar {
            width: 260px;
            background: #1a2a1a;
            border: 3px solid #5f9e5f;
            padding: 16px;
            height: fit-content;
            position: sticky;
            top: 16px;
        }
        /* 8-bit styling */
        button, .tab-btn {
            background: #2b3b2b;
            border: 2px solid #5f9e5f;
            color: #cfffc0;
            font-family: monospace;
            font-weight: bold;
            padding: 6px 12px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #0e2a0e;
            transition: 0.05s linear;
            margin: 4px 0;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #0e2a0e;
        }
        input, textarea {
            background: #0f1a0f;
            border: 2px solid #5f9e5f;
            color: #afff9f;
            font-family: monospace;
            font-size: 1rem;
            padding: 8px;
            width: 100%;
            margin-bottom: 12px;
        }
        .rumor-card {
            background: #1e2e1e;
            border: 2px solid #4e8e4e;
            margin: 16px 0;
            padding: 12px;
            box-shadow: 4px 4px 0 #0e1e0e;
            transition: all 0.1s;
        }
        /* Effekter på rumour border */
        .rumor-card.effect-glow { border: 2px solid #ffcc44; box-shadow: 0 0 8px #ffcc44; }
        .rumor-card.effect-pixel { border: 4px dotted #88ff88; }
        .rumor-card.effect-rainbow { border-image: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet); border-image-slice: 1; border-width: 3px; border-style: solid; }
        .rumor-card.effect-shadow { box-shadow: 8px 8px 0 #000000; }
        .rumor-title { font-size: 1.4rem; font-weight: bold; color: #ffcc77; }
        .rumor-meta { font-size: 0.8rem; color: #8fbf8f; }
        .progress-bar-container {
            background: #0e1a0e;
            border: 2px solid #5f9e5f;
            height: 24px;
            margin: 12px 0;
        }
        .progress-bar-fill {
            background: #6fbf6f;
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }
        .shop-item {
            background: #0e1a0e;
            margin: 8px 0;
            padding: 8px;
            border: 1px solid #5f9e5f;
        }
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 2rem;
            font-family: monospace;
            color: #aaffaa;
            flex-direction: column;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 6px solid #5f9e5f;
            border-top-color: #b3ffaa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .shop-emojis, .shop-effects { margin-top: 16px; }
    </style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <div style="margin-top: 16px;">LADDAR...</div>
</div>

<div id="app" class="app-layout" style="display: none;">
    <!-- Vänster: progress bar -->
    <div class="left-sidebar">
        <h3>⭐ NIVÅ <span id="levelNum">1</span></h3>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="xpProgressFill"></div>
        </div>
        <div>XP: <span id="currentXp">0</span> / <span id="nextLevelXp">100</span></div>
        <div>🪙 MYNT: <span id="userCoinsSide">0</span></div>
    </div>

    <!-- Mitten: dashboard -->
    <div class="main-content">
        <div class="flex-between">
            <h1>🐺 FALU RYKTEN 2</h1>
            <button id="logoutBtn">🚪 LOGGA UT</button>
        </div>
        <!-- Skapa rykte -->
        <div style="border: 2px solid #5f9e5f; padding: 12px; margin-bottom: 20px;">
            <h3>✍️ SPRID ETT RYKTE</h3>
            <input type="text" id="rumorTitle" placeholder="Titel">
            <textarea id="rumorContent" placeholder="Vad har du hört?..."></textarea>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                <select id="rumorEmojiSelect">
                    <option value="">Ingen emoji</option>
                </select>
                <select id="rumorEffectSelect">
                    <option value="">Ingen effekt</option>
                </select>
            </div>
            <button id="postRumorBtn">📢 SKICKA RYKTE (+10 XP, 1🪙)</button>
            <div id="rumorPostMessage" style="margin-top:6px"></div>
        </div>
        <!-- Lista rykten -->
        <h3>📜 ALLA RYKTEN</h3>
        <div id="rumorsList"></div>
    </div>

    <!-- Höger: shop -->
    <div class="right-sidebar">
        <h3>🛒 SHOP</h3>
        <div class="shop-emojis">
            <h4>😀 EMOJIS (5 coins)</h4>
            <div id="emojiShopList"></div>
        </div>
        <div class="shop-effects">
            <h4>✨ EFFEKTER (10 coins)</h4>
            <div id="effectShopList"></div>
        </div>
    </div>
</div>

<!-- Login/register vy (visas först) -->
<div id="loginView" class="app-layout" style="justify-content: center;">
    <div style="background: #1a2a1a; border: 4px solid #5f9e5f; padding: 32px; width: 400px; text-align: center;">
        <h1>🐺 FALU RYKTEN 2</h1>
        <div>
            <button id="showLoginBtn" class="tab-btn active">LOGGA IN</button>
            <button id="showRegisterBtn" class="tab-btn">SKAPA KONTO</button>
        </div>
        <div id="loginFormDiv">
            <input type="text" id="loginUsername" placeholder="Användarnamn"><br>
            <input type="password" id="loginPassword" placeholder="Lösenord"><br>
            <button id="doLoginBtn">🎮 Logga in</button>
            <div id="loginMessage" style="margin-top:10px"></div>
        </div>
        <div id="registerFormDiv" style="display:none">
            <input type="text" id="regUsername" placeholder="Användarnamn (minst 3)"><br>
            <input type="password" id="regPassword" placeholder="Lösenord (minst 4)"><br>
            <button id="doRegisterBtn">📝 Skapa konto</button>
            <div id="regMessage" style="margin-top:10px"></div>
        </div>
    </div>
</div>

<script>
    // ---------- Globals ----------
    let currentUser = null;
    let rumorsData = [];
    let userProfile = { level: 1, xp: 0, coins: 0, owned_emojis: [], owned_effects: [] };
    let loadingCounter = 0;

    const availableEmojis = ["😀", "😂", "😍", "🐺", "📢", "💀", "🎉", "🔥"];
    const availableEffects = ["glow", "pixel", "rainbow", "shadow"];

    // ---------- Loading overlay ----------
    function showLoading() {
        loadingCounter++;
        document.getElementById('loadingOverlay').classList.remove('hidden');
    }
    function hideLoading() {
        loadingCounter--;
        if (loadingCounter <= 0) {
            loadingCounter = 0;
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
    }
    async function withLoading(promise) {
        showLoading();
        try {
            return await promise;
        } finally {
            hideLoading();
        }
    }

    // ---------- API-anrop ----------
    async function apiCall(endpoint, method, body) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(endpoint, opts);
        const data = await res.json();
        return { status: res.status, data };
    }

    // ---------- Hjälpfunktioner ----------
    async function loadUserProfile() {
        if (!currentUser) return;
        const { data } = await apiCall(`/user_data?username=${encodeURIComponent(currentUser)}`, 'GET');
        if (data && typeof data === 'object') {
            userProfile = data;
            updateUI();
        }
    }

    async function loadRumors() {
        const { data } = await apiCall('/rumors', 'GET');
        if (Array.isArray(data)) {
            rumorsData = data;
            renderRumors();
        }
    }

    function updateUI() {
        document.getElementById('levelNum').innerText = userProfile.level || 1;
        document.getElementById('currentXp').innerText = userProfile.xp || 0;
        const nextXp = ((Math.floor((userProfile.xp || 0) / 100) + 1) * 100);
        document.getElementById('nextLevelXp').innerText = nextXp;
        const percent = ((userProfile.xp % 100) / 100) * 100;
        document.getElementById('xpProgressFill').style.width = percent + '%';
        document.getElementById('userCoinsSide').innerText = userProfile.coins || 0;
        // Uppdatera shop-knappar
        renderShop();
        // Uppdatera select-options för emojis/effects baserat på ägda
        updateSelects();
    }

    function updateSelects() {
        const emojiSelect = document.getElementById('rumorEmojiSelect');
        const effectSelect = document.getElementById('rumorEffectSelect');
        const ownedEmojis = userProfile.owned_emojis || [];
        const ownedEffects = userProfile.owned_effects || [];
        emojiSelect.innerHTML = '<option value="">Ingen emoji</option>';
        ownedEmojis.forEach(emoji => {
            emojiSelect.innerHTML += `<option value="${emoji}">${emoji}</option>`;
        });
        effectSelect.innerHTML = '<option value="">Ingen effekt</option>';
        ownedEffects.forEach(effect => {
            effectSelect.innerHTML += `<option value="${effect}">${effect}</option>`;
        });
    }

    async function purchaseItem(type, itemId, price) {
        const { data } = await withLoading(apiCall('/purchase', 'POST', { username: currentUser, type, item_id: itemId, price }));
        if (data.success) {
            await loadUserProfile();
            alert(`Köpte ${itemId}!`);
        } else {
            alert(data.message);
        }
    }

    function renderShop() {
        const emojiContainer = document.getElementById('emojiShopList');
        const effectContainer = document.getElementById('effectShopList');
        const ownedEmojis = userProfile.owned_emojis || [];
        const ownedEffects = userProfile.owned_effects || [];
        emojiContainer.innerHTML = '';
        availableEmojis.forEach(emoji => {
            const owned = ownedEmojis.includes(emoji);
            emojiContainer.innerHTML += `
                <div class="shop-item">
                    <span>${emoji}</span>
                    ${!owned ? `<button class="buyEmojiBtn" data-emoji="${emoji}">Köp (5🪙)</button>` : '<span>Ägd ✅</span>'}
                </div>
            `;
        });
        effectContainer.innerHTML = '';
        availableEffects.forEach(effect => {
            const owned = ownedEffects.includes(effect);
            effectContainer.innerHTML += `
                <div class="shop-item">
                    <span>${effect}</span>
                    ${!owned ? `<button class="buyEffectBtn" data-effect="${effect}">Köp (10🪙)</button>` : '<span>Ägd ✅</span>'}
                </div>
            `;
        });
        // Bind events
        document.querySelectorAll('.buyEmojiBtn').forEach(btn => {
            btn.addEventListener('click', () => purchaseItem('emoji', btn.getAttribute('data-emoji'), 5));
        });
        document.querySelectorAll('.buyEffectBtn').forEach(btn => {
            btn.addEventListener('click', () => purchaseItem('effect', btn.getAttribute('data-effect'), 10));
        });
    }

    async function createRumor(title, content, emoji, effect) {
        const { data } = await withLoading(apiCall('/create_rumor', 'POST', { username: currentUser, title, content, emoji, effect }));
        if (data.success) {
            document.getElementById('rumorTitle').value = '';
            document.getElementById('rumorContent').value = '';
            await loadRumors();
            await loadUserProfile();
            document.getElementById('rumorPostMessage').innerHTML = '✅ Rykte publicerat! +10 XP, +1🪙';
            setTimeout(() => document.getElementById('rumorPostMessage').innerHTML = '', 3000);
        } else {
            document.getElementById('rumorPostMessage').innerHTML = `❌ ${data.message}`;
        }
    }

    function renderRumors() {
        const container = document.getElementById('rumorsList');
        if (!rumorsData.length) {
            container.innerHTML = '<div class="rumor-card">Inga rykten ännu. Bli först!</div>';
            return;
        }
        let html = '';
        for (let r of rumorsData) {
            const dateStr = new Date(r.date).toLocaleString();
            const liked = (r.liked_by || []).includes(currentUser);
            const effectClass = r.effect ? `effect-${r.effect}` : '';
            const emojiPrefix = r.emoji ? `${r.emoji} ` : '';
            html += `
                <div class="rumor-card ${effectClass}" data-id="${r.id}">
                    <div class="rumor-title">${emojiPrefix}${escapeHtml(r.title)}</div>
                    <div class="rumor-meta">Av: ${escapeHtml(r.author)} | ${dateStr}</div>
                    <div class="rumor-content">${escapeHtml(r.content)}</div>
                    <div class="like-comment">
                        <button class="like-btn" data-id="${r.id}">❤️ ${r.likes} gilla</button>
                        <span>💬 ${(r.comments || []).length} kommentarer</span>
                    </div>
                    <div class="comment-section" id="comments-${r.id}">
                        ${(r.comments || []).map(c => `<div class="comment"><strong>${escapeHtml(c.user)}</strong> ${escapeHtml(c.text)}<br><span style="font-size:0.7rem">${new Date(c.date).toLocaleString()}</span></div>`).join('')}
                        <div style="display:flex; gap:6px; margin-top:8px;">
                            <input type="text" id="commentInput-${r.id}" placeholder="Skriv kommentar...">
                            <button class="comment-btn" data-id="${r.id}">Skicka</button>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        // Binda events
        container.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                await withLoading(apiCall('/like_rumor', 'POST', { username: currentUser, rumor_id: id }));
                await loadRumors();
                await loadUserProfile();
            });
        });
        container.querySelectorAll('.comment-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                const input = document.getElementById(`commentInput-${id}`);
                const text = input.value.trim();
                if (text) {
                    await withLoading(apiCall('/comment_rumor', 'POST', { username: currentUser, rumor_id: id, text }));
                    await loadRumors();
                    await loadUserProfile();
                    input.value = '';
                }
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // ---------- Inloggning ----------
    async function login(username, password) {
        const { data } = await withLoading(apiCall('/login', 'POST', { username, password }));
        if (data.success) {
            currentUser = username;
            localStorage.setItem('falunUser', username);
            await loadUserProfile();
            await loadRumors();
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
        } else {
            document.getElementById('loginMessage').innerHTML = data.message || 'Fel uppgifter';
        }
    }

    async function register(username, password) {
        const { data } = await withLoading(apiCall('/register', 'POST', { username, password }));
        if (data.success) {
            document.getElementById('regMessage').innerHTML = 'Konto skapat! Logga in nu.';
            setTimeout(() => document.getElementById('showLoginBtn').click(), 1500);
        } else {
            document.getElementById('regMessage').innerHTML = data.message;
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('falunUser');
        document.getElementById('app').style.display = 'none';
        document.getElementById('loginView').style.display = 'flex';
    }

    // ---------- Event listeners ----------
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginFormDiv').style.display = 'block';
        document.getElementById('registerFormDiv').style.display = 'none';
    };
    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginFormDiv').style.display = 'none';
        document.getElementById('registerFormDiv').style.display = 'block';
    };
    document.getElementById('doLoginBtn').onclick = () => {
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value;
        login(u, p);
    };
    document.getElementById('doRegisterBtn').onclick = () => {
        const u = document.getElementById('regUsername').value.trim();
        const p = document.getElementById('regPassword').value;
        register(u, p);
    };
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('postRumorBtn').onclick = () => {
        const title = document.getElementById('rumorTitle').value.trim();
        const content = document.getElementById('rumorContent').value.trim();
        const emoji = document.getElementById('rumorEmojiSelect').value || null;
        const effect = document.getElementById('rumorEffectSelect').value || null;
        if (!title || !content) {
            document.getElementById('rumorPostMessage').innerHTML = '❌ Titel och innehåll krävs';
            return;
        }
        createRumor(title, content, emoji, effect);
    };

    // Återställ session
    const savedUser = localStorage.getItem('falunUser');
    if (savedUser) {
        currentUser = savedUser;
        (async () => {
            await loadUserProfile();
            if (userProfile && userProfile.level) {
                await loadRumors();
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
            } else {
                logout();
            }
        })();
    } else {
        document.getElementById('loginView').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
    }
</script>
</body>
</html>
