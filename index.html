<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Falun Rykten 2 – 8-bit ryktesmaskin</title>
    <style>
        /* 8-bit stil */
        * {
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: pixelated;
        }
        body {
            background: #0c1a0f;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            color: #b3ffaa;
            text-shadow: 2px 2px 0 #1e3a1a;
        }
        .pixel-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1a2a1a;
            border: 4px solid #8b5a2b;
            box-shadow: 8px 8px 0 #0f0f0f;
            padding: 20px;
        }
        h1, h2, h3 {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f9c23c;
            text-shadow: 3px 3px 0 #6b3e1a;
        }
        button, .pixel-btn {
            background: #2b4a2a;
            border: none;
            color: #eaffb2;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            padding: 8px 16px;
            box-shadow: 3px 3px 0 #0f2a0a;
            cursor: pointer;
            transition: 0.05s linear;
            margin: 5px;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #0f2a0a;
        }
        input, textarea {
            background: #2c2c1c;
            border: 2px solid #8b5a2b;
            color: #ddf5c0;
            font-family: 'Courier New', monospace;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .rykte-card {
            background: #1f321f;
            border: 3px solid #a57c3c;
            margin: 15px 0;
            padding: 12px;
            box-shadow: 5px 5px 0 #0b1a0b;
        }
        .status-bar {
            background: #0b1a0b;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            border-bottom: 2px solid #8b5a2b;
        }
        .xp-bar {
            background: #3a2a1a;
            height: 16px;
            width: 100%;
            margin: 5px 0;
        }
        .xp-fill {
            background: #6bc46b;
            height: 100%;
            width: 0%;
        }
        .cooldown-timer {
            font-family: monospace;
            background: black;
            padding: 4px 8px;
            display: inline-block;
        }
        .likes, .comments {
            font-size: 14px;
            margin-top: 8px;
        }
        .pixel-border {
            border: 2px solid #cab87a;
            padding: 6px;
        }
        .error {
            color: #ffaa88;
            background: #4a1a1a;
        }
        .success {
            color: #aaffaa;
        }
    </style>
</head>
<body>
<div class="pixel-container" id="app">
    <!-- Vy: inloggning / registrering -->
    <div id="authView">
        <h1>🐺 FALU RYKTEN 2</h1>
        <div style="display: flex; gap: 20px; margin-bottom: 20px;">
            <button id="showLoginBtn" class="pixel-btn">🔐 LOGGA IN</button>
            <button id="showRegisterBtn" class="pixel-btn">✨ SKAPA KONTO</button>
        </div>
        <div id="loginFormDiv">
            <h3>Logga in</h3>
            <input type="text" id="loginUsername" placeholder="Användarnamn"><br>
            <input type="password" id="loginPassword" placeholder="Lösenord"><br>
            <button id="doLoginBtn">🎮 Logga in</button>
            <div id="loginMsg"></div>
        </div>
        <div id="registerFormDiv" style="display:none">
            <h3>Skapa konto</h3>
            <input type="text" id="regUsername" placeholder="Användarnamn (minst 3)"><br>
            <input type="password" id="regPassword" placeholder="Lösenord (minst 4)"><br>
            <button id="doRegisterBtn">📝 Skapa</button>
            <div id="regMsg"></div>
        </div>
    </div>

    <!-- Vy: dashboard (efter inloggning) -->
    <div id="dashboardView" style="display:none">
        <div class="status-bar">
            <div>👤 <span id="userName"></span>  Level <span id="userLevel"></span></div>
            <div>🪙 Coins: <span id="userCoins"></span></div>
            <div>⏱️ Cooldown: <span id="cooldownText">0</span>s</div>
            <button id="logoutBtn" class="pixel-btn">🚪 Logga ut</button>
        </div>
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
        <div>✨ XP: <span id="userXp"></span> / <span id="nextXp"></span></div>

        <h2>✍️ Skapa nytt rykte</h2>
        <input type="text" id="rykteTitle" placeholder="Titel"><br>
        <textarea id="rykteContent" rows="3" placeholder="Ryktets innehåll..."></textarea><br>
        <button id="postRykteBtn" class="pixel-btn">📢 SKICKA RYKTE</button>
        <div id="postMsg"></div>

        <h2>🔥 Alla rykten</h2>
        <div id="ryktenList"></div>

        <h2>🛒 Effekt-shop</h2>
        <button class="buyEffect" data-effect="double_xp">⚡ Double XP (30 coins)</button>
        <button class="buyEffect" data-effect="cooldown_half">⏩ Halva cooldown (50 coins)</button>
        <div id="shopMsg"></div>
    </div>
</div>

<script>
    let currentUser = null;
    let cooldownInterval = null;

    // Hjälpfunktion för anrop
    async function apiCall(endpoint, data) {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return res.json();
    }

    // Uppdatera dashboard
    async function loadDashboard() {
        if (!currentUser) return;
        const res = await fetch(`/dashboard?username=${encodeURIComponent(currentUser)}`);
        const data = await res.json();
        if (!data.success) {
            alert("Kunde inte ladda dashboard");
            return;
        }
        const user = data.user;
        document.getElementById('userName').innerText = user.username;
        document.getElementById('userLevel').innerText = user.level;
        document.getElementById('userCoins').innerText = user.coins;
        document.getElementById('userXp').innerText = user.xp;
        const nextXp = user.level * 100;
        document.getElementById('nextXp').innerText = nextXp;
        const percent = (user.xp / nextXp) * 100;
        document.getElementById('xpFill').style.width = percent + '%';
        // Cooldown visning
        const remaining = Math.ceil(user.remaining_cooldown);
        document.getElementById('cooldownText').innerText = remaining > 0 ? remaining : "redo";
        if (cooldownInterval) clearInterval(cooldownInterval);
        // räkna ner
        if (remaining > 0) {
            let timeLeft = remaining;
            cooldownInterval = setInterval(() => {
                if (timeLeft <= 1) {
                    clearInterval(cooldownInterval);
                    document.getElementById('cooldownText').innerText = "redo";
                } else {
                    timeLeft--;
                    document.getElementById('cooldownText').innerText = timeLeft;
                }
            }, 1000);
        }
        // Visa rykten
        const rykten = data.rykten;
        const container = document.getElementById('ryktenList');
        container.innerHTML = '';
        rykten.slice().reverse().forEach(r => {
            const card = document.createElement('div');
            card.className = 'rykte-card';
            card.innerHTML = `
                <strong>📢 ${escapeHtml(r.title)}</strong><br>
                av ${r.author}<br>
                ${escapeHtml(r.content)}<br>
                <div class="likes">❤️ ${r.likes} gillar  &nbsp; 
                    <button class="likeBtn" data-id="${r.id}">👍 Like</button>
                </div>
                <div class="comments">
                    💬 Kommentarer:<br>
                    ${r.comments.map(c => `<b>${c.user}:</b> ${escapeHtml(c.text)}`).join('<br>') || "Inga kommentarer än."}
                    <br>
                    <input type="text" id="comment_${r.id}" placeholder="Skriv kommentar...">
                    <button class="commentBtn" data-id="${r.id}">Skicka</button>
                </div>
            `;
            container.appendChild(card);
        });
        // Lägg till event listeners för like/comment
        document.querySelectorAll('.likeBtn').forEach(btn => {
            btn.onclick = async () => {
                const id = parseInt(btn.dataset.id);
                const res = await apiCall('/like', { username: currentUser, rykte_id: id });
                if (res.success) loadDashboard();
                else alert(res.message);
            };
        });
        document.querySelectorAll('.commentBtn').forEach(btn => {
            btn.onclick = async () => {
                const id = parseInt(btn.dataset.id);
                const input = document.getElementById(`comment_${id}`);
                const text = input.value.trim();
                if (!text) return;
                const res = await apiCall('/comment', { username: currentUser, rykte_id: id, comment: text });
                if (res.success) {
                    input.value = '';
                    loadDashboard();
                } else alert(res.message);
            };
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Skapa rykte
    document.getElementById('postRykteBtn')?.addEventListener('click', async () => {
        const title = document.getElementById('rykteTitle').value.trim();
        const content = document.getElementById('rykteContent').value.trim();
        if (!title || !content) {
            document.getElementById('postMsg').innerText = "Titel och innehåll krävs!";
            return;
        }
        const res = await apiCall('/create_rykte', { username: currentUser, title, content });
        if (res.success) {
            document.getElementById('rykteTitle').value = '';
            document.getElementById('rykteContent').value = '';
            document.getElementById('postMsg').innerText = "✅ Rykte publicerat!";
            loadDashboard();
        } else {
            document.getElementById('postMsg').innerText = "❌ " + res.message;
        }
    });

    // Köp effekter
    document.querySelectorAll('.buyEffect').forEach(btn => {
        btn.onclick = async () => {
            const effect = btn.dataset.effect;
            const res = await apiCall('/buy_effect', { username: currentUser, effect });
            if (res.success) {
                document.getElementById('shopMsg').innerText = res.message;
                loadDashboard();
            } else {
                document.getElementById('shopMsg').innerText = "❌ " + res.message;
            }
        };
    });

    // Inloggningslogik
    const authView = document.getElementById('authView');
    const dashView = document.getElementById('dashboardView');
    const loginFormDiv = document.getElementById('loginFormDiv');
    const registerFormDiv = document.getElementById('registerFormDiv');

    document.getElementById('showLoginBtn').onclick = () => {
        loginFormDiv.style.display = 'block';
        registerFormDiv.style.display = 'none';
    };
    document.getElementById('showRegisterBtn').onclick = () => {
        loginFormDiv.style.display = 'none';
        registerFormDiv.style.display = 'block';
    };
    document.getElementById('doLoginBtn').onclick = async () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const res = await apiCall('/login', { username, password });
        if (res.success) {
            currentUser = username;
            authView.style.display = 'none';
            dashView.style.display = 'block';
            loadDashboard();
        } else {
            document.getElementById('loginMsg').innerText = "Fel inloggning";
        }
    };
    document.getElementById('doRegisterBtn').onclick = async () => {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        if (username.length < 3) { document.getElementById('regMsg').innerText = "För kort användarnamn"; return; }
        if (password.length < 4) { document.getElementById('regMsg').innerText = "Lösenord minst 4 tecken"; return; }
        const res = await apiCall('/register', { username, password });
        if (res.success) {
            document.getElementById('regMsg').innerText = "Konto skapat! Logga in nu.";
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = password;
            document.getElementById('showLoginBtn').click();
        } else {
            document.getElementById('regMsg').innerText = res.message;
        }
    };
    document.getElementById('logoutBtn').onclick = () => {
        currentUser = null;
        if (cooldownInterval) clearInterval(cooldownInterval);
        authView.style.display = 'block';
        dashView.style.display = 'none';
    };
    // Visa inloggning som standard
    loginFormDiv.style.display = 'block';
    registerFormDiv.style.display = 'none';
</script>
</body>
</html>
