<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Falun Rykten 2 – 8-bit ryktesmaskin</title>
    <style>
        /* ---------- RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        body {
            background: #0c1a0f;
            font-family: 'Courier New', 'VT323', monospace;
            padding: 24px;
            color: #b3ffaa;
        }
        /* ---------- RETRO CONTAINER ---------- */
        .retro-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #1e2a1a;
            border: 4px solid #5f9e5f;
            box-shadow: 8px 8px 0 #0a1f0a;
            padding: 20px;
        }
        /* 3-kolumn layout */
        .app-layout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        /* vänster sidofält */
        .left-sidebar {
            flex: 1.2;
            min-width: 200px;
            background: #162012;
            border: 2px solid #5f9e5f;
            padding: 16px;
            box-shadow: inset 2px 2px 0 #2a3a2a, 4px 4px 0 #0a1f0a;
        }
        /* mitten – huvudflöde */
        .main-content {
            flex: 3;
            min-width: 260px;
            background: #162012;
            border: 2px solid #5f9e5f;
            padding: 16px;
            box-shadow: inset 2px 2px 0 #2a3a2a, 4px 4px 0 #0a1f0a;
        }
        /* höger sidofält – shop */
        .right-sidebar {
            flex: 1.2;
            min-width: 220px;
            background: #162012;
            border: 2px solid #5f9e5f;
            padding: 16px;
            box-shadow: inset 2px 2px 0 #2a3a2a, 4px 4px 0 #0a1f0a;
        }
        /* retro knappar */
        .retro-btn {
            background: #2b3b2b;
            border: none;
            color: #cfffc0;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 6px 12px;
            box-shadow: 3px 3px 0 #0e2a0e;
            cursor: pointer;
            transition: 0.05s linear;
            text-transform: uppercase;
        }
        .retro-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #0e2a0e;
        }
        .retro-btn.outline {
            background: transparent;
            border: 2px solid #5f9e5f;
            box-shadow: none;
        }
        input, textarea, select {
            background: #0f1a0f;
            border: 2px solid #5f9e5f;
            color: #afff9f;
            font-family: monospace;
            font-size: 1rem;
            padding: 8px;
            width: 100%;
            margin-bottom: 12px;
        }
        /* progress bar */
        .progress-wrapper {
            background: #0a120a;
            border: 2px solid #5f9e5f;
            height: 20px;
            margin: 12px 0;
        }
        .progress-fill {
            background: #6fbf6f;
            height: 100%;
            width: 0%;
            transition: width 0.2s steps(10);
        }
        /* rumour cards – med coola 8-bit effekter */
        .rumor-card {
            background: #1e2a1a;
            border: 2px solid #4e8e4e;
            margin-bottom: 20px;
            padding: 14px;
            box-shadow: 4px 4px 0 #0a1f0a;
            transition: all 0.1s;
            position: relative;
        }
        /* GLOW-effekt */
        .rumor-card.effect-glow {
            border-color: #ffcc44;
            box-shadow: 0 0 12px #ffcc44, 4px 4px 0 #0a1f0a;
            animation: glowPulse 0.8s infinite alternate;
        }
        @keyframes glowPulse {
            from { box-shadow: 0 0 5px #ffcc44, 4px 4px 0 #0a1f0a; }
            to { box-shadow: 0 0 20px #ffaa33, 4px 4px 0 #0a1f0a; }
        }
        /* LUMINANCE */
        .rumor-card.effect-luminance {
            border-color: #ffffff;
            background: #2e3e2e;
            box-shadow: 0 0 20px #ffffff, 4px 4px 0 #0a1f0a;
            animation: luminancePulse 1s infinite;
        }
        @keyframes luminancePulse {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.2); }
        }
        /* SHADOW */
        .rumor-card.effect-shadow {
            box-shadow: 8px 8px 0 #000000;
            transform: translate(-2px, -2px);
        }
        /* FLAME */
        .rumor-card.effect-flame {
            border-color: #ff884d;
            animation: flameFlicker 0.15s infinite;
        }
        @keyframes flameFlicker {
            0% { border-color: #ff884d; box-shadow: 0 0 5px #ff884d; }
            50% { border-color: #ff5500; box-shadow: 0 0 15px #ff5500; }
            100% { border-color: #ff884d; box-shadow: 0 0 5px #ff884d; }
        }
        /* CRYSTAL */
        .rumor-card.effect-crystal {
            border-color: #88aaff;
            background: linear-gradient(135deg, #1e3a2e, #1e2a3a);
            animation: crystalShine 1.2s infinite;
        }
        @keyframes crystalShine {
            0% { box-shadow: 0 0 5px #88aaff; }
            50% { box-shadow: 0 0 25px #aaffdd; }
            100% { box-shadow: 0 0 5px #88aaff; }
        }
        /* NUKE – extra dramatisk */
        .rumor-card.effect-nuke {
            border-color: #ff4444;
            animation: nukeShake 0.15s infinite;
            background: #3a1a1a;
        }
        @keyframes nukeShake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -2px); }
            50% { transform: translate(-2px, 0); }
            75% { transform: translate(1px, 2px); }
            100% { transform: translate(0,0); }
        }
        .nuke-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffaa44, #ff2200);
            pointer-events: none;
            z-index: 9999;
            animation: nukeBlast 0.6s forwards;
        }
        @keyframes nukeBlast {
            0% { opacity: 1; transform: scale(0); }
            100% { opacity: 0; transform: scale(15); display: none; }
        }
        .rumor-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffcc77;
            text-shadow: 2px 2px 0 #4a2a1a;
        }
        .rumor-meta {
            font-size: 0.75rem;
            color: #8fbf8f;
            cursor: pointer;
            text-decoration: underline;
            margin: 6px 0;
        }
        .comment {
            background: #0e1a0e;
            padding: 6px;
            margin: 8px 0;
            border-left: 4px solid #5f9e5f;
        }
        .emoji-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .emoji-btn {
            background: #1e2e1e;
            border: 1px solid #5f9e5f;
            font-size: 1.2rem;
            padding: 4px 8px;
            cursor: pointer;
            font-family: monospace;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            flex-direction: column;
        }
        .pixel-spinner {
            width: 48px;
            height: 48px;
            border: 6px solid #5f9e5f;
            border-top-color: #b3ffaa;
            image-rendering: pixelated;
            animation: spin 0.6s steps(8) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10001;
        }
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e2a1a;
            border: 4px solid #5f9e5f;
            padding: 24px;
            z-index: 10002;
            width: 280px;
            text-align: center;
            box-shadow: 8px 8px 0 #0a1f0a;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        hr {
            border-color: #4e7e4e;
            margin: 12px 0;
        }
        h1, h2, h3 {
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 0 #0a2a0a;
        }
        .stat-block {
            background: #0e1a0e;
            margin: 12px 0;
            padding: 8px;
            text-align: center;
            border: 1px solid #5f9e5f;
        }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="pixel-spinner"></div>
    <div style="margin-top: 16px;">LADDAR...</div>
</div>

<div id="app" style="display: none;">
    <div class="retro-container">
        <div class="app-layout">
            <!-- Vänster: progress & stats -->
            <div class="left-sidebar">
                <div class="stat-block">
                    <span>⭐ NIVÅ</span>
                    <div style="font-size: 2rem; font-weight: bold;" id="levelNum">1</div>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-fill" id="xpProgressFill"></div>
                </div>
                <div>XP: <span id="currentXp">0</span> / <span id="nextLevelXp">100</span></div>
                <div class="stat-block">🪙 MYNT: <strong id="userCoinsSide">0</strong></div>
                <div class="stat-block">📢 RYKTEN: <strong id="userRumorsCount">0</strong></div>
            </div>

            <!-- Mitten: huvudflöde -->
            <div class="main-content">
                <div class="flex-between">
                    <h1>🐺 FALU RYKTEN 2</h1>
                    <button id="logoutBtn" class="retro-btn outline">🚪 LOGGA UT</button>
                </div>
                <!-- Skapa rykte -->
                <div style="background:#142010; padding: 12px; margin: 16px 0; border: 2px solid #5f9e5f;">
                    <h3>✍️ SPRID RYKTE</h3>
                    <input type="text" id="rumorTitle" placeholder="TITEL">
                    <textarea id="rumorContent" rows="3" placeholder="Vad har du hört?..."></textarea>
                    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
                        <select id="rumorEmojiSelect"><option value="">INGEN EMOJI</option></select>
                        <select id="rumorEffectSelect"><option value="">INGEN EFFEKT</option></select>
                    </div>
                    <button id="postRumorBtn" class="retro-btn">📢 SKICKA (+10 XP, +1🪙)</button>
                    <div id="rumorPostMessage" style="margin-top: 8px;"></div>
                </div>
                <h3>📜 ALLA RYKTEN</h3>
                <div id="rumorsList"></div>
            </div>

            <!-- Höger: shop -->
            <div class="right-sidebar">
                <h3>🛒 BUTIK</h3>
                <div id="emojiShopList"></div>
                <hr>
                <div id="effectShopList"></div>
            </div>
        </div>
    </div>
</div>

<!-- Loginvy -->
<div id="loginView" style="display: flex; justify-content: center; align-items: center; min-height: 90vh;">
    <div class="retro-container" style="max-width: 450px; text-align: center;">
        <h1>🐺 FALU RYKTEN 2</h1>
        <div style="display: flex; gap: 12px; margin: 20px 0;">
            <button id="showLoginBtn" class="retro-btn">LOGGA IN</button>
            <button id="showRegisterBtn" class="retro-btn outline">SKAPA KONTO</button>
        </div>
        <div id="loginFormDiv">
            <input type="text" id="loginUsername" placeholder="ANVÄNDARNAMN">
            <input type="password" id="loginPassword" placeholder="LÖSENORD">
            <button id="doLoginBtn" class="retro-btn">🎮 LOGGA IN</button>
            <div id="loginMessage" style="margin-top: 12px;"></div>
        </div>
        <div id="registerFormDiv" style="display:none">
            <input type="text" id="regUsername" placeholder="ANVÄNDARNAMN (minst 3)">
            <input type="password" id="regPassword" placeholder="LÖSENORD (minst 4)">
            <button id="doRegisterBtn" class="retro-btn">📝 SKAPA KONTO</button>
            <div id="regMessage" style="margin-top: 12px;"></div>
        </div>
    </div>
</div>

<script>
    // ---------- Globals ----------
    let currentUser = null;
    let rumorsData = [];
    let userProfile = { level: 1, xp: 0, coins: 10, owned_emojis: [], owned_effects: [] };
    let loadingCounter = 0;

    // Shop items (priser och id:n)
    const emojiShopItems = [
        { id: "🌈", name: "Rainbow", price: 5 },
        { id: "💀", name: "Skull", price: 10 },
        { id: "🔥", name: "Fire", price: 15 },
        { id: "🐒", name: "Apa", price: 20 },
        { id: "💰", name: "Pengar", price: 25 },
        { id: "😈", name: "Devil", price: 30 },
        { id: "🍆", name: "Eggplant", price: 35 },
        { id: "🍑", name: "Peach", price: 35 },
        { id: "😱", name: "Omg", price: 40 }
    ];
    const effectShopItems = [
        { id: "glow", name: "Glow", price: 10 },
        { id: "luminance", name: "Luminance", price: 20 },
        { id: "shadow", name: "Shadow", price: 50 },
        { id: "flame", name: "Flame", price: 100 },
        { id: "crystal", name: "Crystal", price: 250 },
        { id: "nuke", name: "Nuke", price: 500 }
    ];

    // ---------- Loading ----------
    function showLoading() { loadingCounter++; document.getElementById('loadingOverlay').classList.remove('hidden'); }
    function hideLoading() { loadingCounter--; if (loadingCounter <= 0) { loadingCounter = 0; document.getElementById('loadingOverlay').classList.add('hidden'); } }
    async function withLoading(promise) { showLoading(); try { return await promise; } finally { hideLoading(); } }

    // ---------- API ----------
    async function apiCall(endpoint, method, body) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(endpoint, opts);
        const data = await res.json();
        return { status: res.status, data };
    }

    async function loadUserProfile() {
        if (!currentUser) return;
        const { data } = await apiCall(`/user_data?username=${encodeURIComponent(currentUser)}`, 'GET');
        if (data && !data.error) {
            userProfile = data;
            updateUI();
        }
    }

    async function loadRumors() {
        const { data } = await apiCall('/rumors', 'GET');
        if (Array.isArray(data)) {
            rumorsData = data;
            renderRumors();
            updateUI(); // uppdatera räknaren egna rykten
        }
    }

    function updateUI() {
        document.getElementById('levelNum').innerText = userProfile.level;
        document.getElementById('currentXp').innerText = userProfile.xp;
        const nextXp = (Math.floor(userProfile.xp / 100) + 1) * 100;
        document.getElementById('nextLevelXp').innerText = nextXp;
        const percent = (userProfile.xp % 100) / 100 * 100;
        document.getElementById('xpProgressFill').style.width = percent + '%';
        document.getElementById('userCoinsSide').innerText = userProfile.coins;
        const userRumors = rumorsData.filter(r => r.author === currentUser).length;
        document.getElementById('userRumorsCount').innerText = userRumors;
        renderShop();
        updateSelects();
    }

    function updateSelects() {
        const emojiSelect = document.getElementById('rumorEmojiSelect');
        const effectSelect = document.getElementById('rumorEffectSelect');
        emojiSelect.innerHTML = '<option value="">INGEN EMOJI</option>';
        (userProfile.owned_emojis || []).forEach(emoji => {
            emojiSelect.innerHTML += `<option value="${emoji}">${emoji}</option>`;
        });
        effectSelect.innerHTML = '<option value="">INGEN EFFEKT</option>';
        (userProfile.owned_effects || []).forEach(effect => {
            effectSelect.innerHTML += `<option value="${effect}">${effect}</option>`;
        });
    }

    async function purchaseItem(type, itemId, price) {
        const { data } = await withLoading(apiCall('/purchase', 'POST', { username: currentUser, type, item_id: itemId, price }));
        if (data.success) {
            await loadUserProfile();
            alert(`Köpte ${itemId}!`);
        } else {
            alert(data.message);
        }
    }

    function renderShop() {
        const emojiContainer = document.getElementById('emojiShopList');
        const effectContainer = document.getElementById('effectShopList');
        const ownedEmojis = userProfile.owned_emojis || [];
        const ownedEffects = userProfile.owned_effects || [];
        emojiContainer.innerHTML = '<h3>😀 EMOJIS</h3>';
        emojiShopItems.forEach(item => {
            const owned = ownedEmojis.includes(item.id);
            emojiContainer.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin:8px 0; background:#0e1a0e; padding:6px;">
                    <span>${item.id} ${item.name} (${item.price}🪙)</span>
                    ${!owned ? `<button class="retro-btn buyEmojiBtn" data-emoji="${item.id}" data-price="${item.price}">KÖP</button>` : '<span>✅ ÄGD</span>'}
                </div>
            `;
        });
        effectContainer.innerHTML = '<h3>✨ EFFEKTER</h3>';
        effectShopItems.forEach(item => {
            const owned = ownedEffects.includes(item.id);
            effectContainer.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin:8px 0; background:#0e1a0e; padding:6px;">
                    <span>${item.name} (${item.price}🪙)</span>
                    ${!owned ? `<button class="retro-btn buyEffectBtn" data-effect="${item.id}" data-price="${item.price}">KÖP</button>` : '<span>✅ ÄGD</span>'}
                </div>
            `;
        });
        document.querySelectorAll('.buyEmojiBtn').forEach(btn => {
            btn.addEventListener('click', () => purchaseItem('emoji', btn.getAttribute('data-emoji'), parseInt(btn.getAttribute('data-price'))));
        });
        document.querySelectorAll('.buyEffectBtn').forEach(btn => {
            btn.addEventListener('click', () => purchaseItem('effect', btn.getAttribute('data-effect'), parseInt(btn.getAttribute('data-price'))));
        });
    }

    async function createRumor(title, content, emoji, effect) {
        const { data } = await withLoading(apiCall('/create_rumor', 'POST', { username: currentUser, title, content, emoji, effect }));
        if (data.success) {
            document.getElementById('rumorTitle').value = '';
            document.getElementById('rumorContent').value = '';
            await loadRumors();
            await loadUserProfile();
            document.getElementById('rumorPostMessage').innerHTML = '✅ RYKTE PUBLICERAT! +10 XP, +1🪙';
            setTimeout(() => document.getElementById('rumorPostMessage').innerHTML = '', 3000);
        } else {
            document.getElementById('rumorPostMessage').innerHTML = `❌ ${data.message}`;
        }
    }

    function triggerNukeAnimation() {
        const overlay = document.createElement('div');
        overlay.className = 'nuke-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 800);
    }

    async function likeRumor(id) {
        const { data } = await withLoading(apiCall('/like_rumor', 'POST', { username: currentUser, rumor_id: id }));
        if (data.success) {
            await loadRumors();
            await loadUserProfile();
        } else {
            alert(data.message);
        }
    }

    async function downvoteRumor(id) {
        const { data } = await withLoading(apiCall('/downvote_rumor', 'POST', { username: currentUser, rumor_id: id }));
        if (data.success) {
            await loadRumors();
            await loadUserProfile();
        } else {
            alert(data.message);
        }
    }

    async function commentRumor(id, text) {
        const { data } = await withLoading(apiCall('/comment_rumor', 'POST', { username: currentUser, rumor_id: id, text }));
        if (data.success) {
            await loadRumors();
            await loadUserProfile();
        } else {
            alert(data.message);
        }
    }

    function showUserProfile(username) {
        fetch(`/user_data?username=${encodeURIComponent(username)}`).then(res => res.json()).then(profile => {
            const modalHtml = `
                <div id="profileModalBackdrop" class="modal-backdrop"></div>
                <div class="modal">
                    <h3>${profile.username}</h3>
                    <p>⭐ NIVÅ: ${profile.level}</p>
                    <p>✨ XP: ${profile.xp}</p>
                    <p>🪙 MYNT: ${profile.coins}</p>
                    <p>😀 EMOJIS: ${(profile.owned_emojis || []).join(' ') || 'INGA'}</p>
                    <p>✨ EFFEKTER: ${(profile.owned_effects || []).join(', ') || 'INGA'}</p>
                    <button id="closeProfileBtn" class="retro-btn">STÄNG</button>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('closeProfileBtn').onclick = () => {
                document.getElementById('profileModalBackdrop')?.remove();
                document.querySelector('.modal')?.remove();
            };
        });
    }

    function renderRumors() {
        const container = document.getElementById('rumorsList');
        if (!rumorsData.length) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">INGA RYKTEN ÄN. BLI FÖRST!</div>';
            return;
        }
        let html = '';
        for (let r of rumorsData) {
            const dateStr = new Date(r.date).toLocaleString();
            const effectClass = r.effect ? `effect-${r.effect}` : '';
            const emojiPrefix = r.emoji ? `${r.emoji} ` : '';
            html += `
                <div class="rumor-card ${effectClass}" data-id="${r.id}">
                    <div class="rumor-title">${emojiPrefix}${escapeHtml(r.title)}</div>
                    <div class="rumor-meta" onclick="showUserProfile('${escapeHtml(r.author)}')">AV: ${escapeHtml(r.author)} | ${dateStr}</div>
                    <div class="rumor-content">${escapeHtml(r.content)}</div>
                    <div class="like-comment" style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap;">
                        <button class="retro-btn like-btn" data-id="${r.id}">❤️ ${r.likes}</button>
                        <button class="retro-btn downvote-btn" data-id="${r.id}">👎 NEDRÖSTA (10🪙)</button>
                        <span>💬 ${(r.comments || []).length} KOMMENTARER</span>
                    </div>
                    <div class="comment-section" id="comments-${r.id}">
                        ${(r.comments || []).map(c => `<div class="comment"><strong onclick="showUserProfile('${escapeHtml(c.user)}')" style="cursor:pointer;">${escapeHtml(c.user)}</strong> ${escapeHtml(c.text)}<br><span style="font-size:0.7rem">${new Date(c.date).toLocaleString()}</span></div>`).join('')}
                        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;">
                            <input type="text" id="commentInput-${r.id}" placeholder="SKRIV KOMMENTAR..." style="flex:1;">
                            <div class="emoji-picker" id="emojiPicker-${r.id}">
                                ${(userProfile.owned_emojis || []).map(e => `<button class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}
                            </div>
                            <button class="retro-btn comment-btn" data-id="${r.id}">SKICKA</button>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        // bind events
        container.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', async () => await likeRumor(parseInt(btn.getAttribute('data-id'))));
        });
        container.querySelectorAll('.downvote-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (confirm('KOSTAR 10 COINS ATT NEDRÖSTA. FORTSÄTTA?'))
                    await downvoteRumor(parseInt(btn.getAttribute('data-id')));
            });
        });
        container.querySelectorAll('.comment-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = parseInt(btn.getAttribute('data-id'));
                const input = document.getElementById(`commentInput-${id}`);
                const text = input.value.trim();
                if (text) await commentRumor(id, text);
                input.value = '';
            });
        });
        container.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const emoji = btn.getAttribute('data-emoji');
                const commentDiv = btn.closest('.comment-section');
                const input = commentDiv.querySelector('input');
                input.value += emoji;
            });
        });
        // Nuke animation om något synligt rykte har nuke-effekt
        if (rumorsData.some(r => r.effect === 'nuke')) triggerNukeAnimation();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // ---------- Inloggning ----------
    async function login(username, password) {
        const { data } = await withLoading(apiCall('/login', 'POST', { username, password }));
        if (data.success) {
            currentUser = username;
            localStorage.setItem('falunUser', username);
            await loadUserProfile();
            await loadRumors();
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        } else {
            document.getElementById('loginMessage').innerHTML = data.message || 'FEL UPPGIFTER';
        }
    }

    async function register(username, password) {
        const { data } = await withLoading(apiCall('/register', 'POST', { username, password }));
        if (data.success) {
            document.getElementById('regMessage').innerHTML = 'KONTO SKAPAT! LOGGA IN NU.';
            document.getElementById('regMessage').style.color = '#b3ffaa';
            setTimeout(() => document.getElementById('showLoginBtn').click(), 1500);
        } else {
            document.getElementById('regMessage').innerHTML = data.message;
            document.getElementById('regMessage').style.color = '#ff8866';
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('falunUser');
        document.getElementById('app').style.display = 'none';
        document.getElementById('loginView').style.display = 'flex';
    }

    // ---------- Event listeners ----------
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('loginFormDiv').style.display = 'block';
        document.getElementById('registerFormDiv').style.display = 'none';
    };
    document.getElementById('showRegisterBtn').onclick = () => {
        document.getElementById('loginFormDiv').style.display = 'none';
        document.getElementById('registerFormDiv').style.display = 'block';
    };
    document.getElementById('doLoginBtn').onclick = () => {
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value;
        login(u, p);
    };
    document.getElementById('doRegisterBtn').onclick = () => {
        const u = document.getElementById('regUsername').value.trim();
        const p = document.getElementById('regPassword').value;
        register(u, p);
    };
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('postRumorBtn').onclick = () => {
        const title = document.getElementById('rumorTitle').value.trim();
        const content = document.getElementById('rumorContent').value.trim();
        const emoji = document.getElementById('rumorEmojiSelect').value || null;
        const effect = document.getElementById('rumorEffectSelect').value || null;
        if (!title || !content) {
            document.getElementById('rumorPostMessage').innerHTML = '❌ TITEL OCH INNEHÅLL KRAVS';
            return;
        }
        createRumor(title, content, emoji, effect);
    };

    // Återställ session
    const savedUser = localStorage.getItem('falunUser');
    if (savedUser) {
        currentUser = savedUser;
        (async () => {
            await loadUserProfile();
            if (userProfile && userProfile.level) {
                await loadRumors();
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } else {
                logout();
            }
        })();
    } else {
        document.getElementById('loginView').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
    }
</script>
</body>
</html>
