<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falun Rykten 2 - 8-bit Ryktesmaskin</title>
    <style>
        /* 8-bit retro stil */
        * {
            box-sizing: border-box;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: pixelated;
        }
        body {
            background: #0c1a0f;
            background-image: repeating-linear-gradient(0deg, #1a3a1a 0px, #1a3a1a 2px, #0c1a0f 2px, #0c1a0f 8px);
            font-family: 'Courier New', 'VT323', monospace;
            margin: 0;
            padding: 20px;
            color: #9bff9b;
        }
        .pixel-container {
            max-width: 900px;
            margin: 0 auto;
            background: #000000aa;
            border: 4px solid #6f9e6f;
            box-shadow: 8px 8px 0 #2a4a2a;
            padding: 20px;
            backdrop-filter: blur(1px);
        }
        h1, h2 {
            text-shadow: 3px 3px 0 #1a3a1a;
            letter-spacing: 2px;
            font-size: 2rem;
            margin: 0 0 10px 0;
        }
        button, .pixel-button {
            background: #2a4a2a;
            border: none;
            color: #bfffbf;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1rem;
            padding: 8px 16px;
            margin: 4px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #0a2a0a;
            transition: 0.05s linear;
            text-transform: uppercase;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #0a2a0a;
        }
        input, textarea {
            background: #1a2a1a;
            border: 2px solid #6f9e6f;
            color: #bfffbf;
            font-family: 'Courier New', monospace;
            padding: 8px;
            width: 100%;
            margin-bottom: 10px;
        }
        .rumor-card {
            background: #0a1a0a;
            border: 2px solid #6f9e6f;
            margin: 15px 0;
            padding: 12px;
            box-shadow: 4px 4px 0 #1a3a1a;
        }
        .rumor-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffcc66;
        }
        .rumor-meta {
            font-size: 0.8rem;
            color: #7a9e7a;
        }
        .like-btn, .comment-btn {
            background: #3a5a3a;
            font-size: 0.8rem;
            padding: 4px 12px;
            margin-top: 8px;
        }
        .comment-section {
            margin-top: 12px;
            border-top: 1px dashed #6f9e6f;
            padding-top: 8px;
        }
        .comment {
            background: #1e2e1e;
            margin: 6px 0;
            padding: 6px;
            font-size: 0.85rem;
        }
        .status-bar {
            background: #0a0a0a;
            border: 2px solid #6f9e6f;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .stat {
            background: #1a2a1a;
            padding: 6px 12px;
            font-weight: bold;
        }
        .error {
            color: #ffaa99;
            background: #441111;
            padding: 6px;
        }
        .success {
            color: #aaffaa;
        }
        .cooldown {
            color: #ffaa66;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="pixel-container" id="app">
    <!-- Inloggningsvy -->
    <div id="loginView">
        <h1>🐺 FALU RYKTEN 2</h1>
        <div class="sub">⚡ 8-BIT RYKTESMASKIN ⚡</div>
        <div class="switch-buttons" style="display: flex; gap: 10px; margin: 20px 0;">
            <button id="showLoginBtn">🔐 LOGGA IN</button>
            <button id="showRegisterBtn">✨ SKAPA KONTO</button>
        </div>
        <div id="loginFormDiv">
            <h2>LOGGA IN</h2>
            <input type="text" id="loginUsername" placeholder="ANVÄNDARNAMN">
            <input type="password" id="loginPassword" placeholder="LÖSENORD">
            <button id="doLoginBtn">🎮 START</button>
            <div id="loginMsg" class="error hidden"></div>
        </div>
        <div id="registerFormDiv" class="hidden">
            <h2>SKAPA KONTO</h2>
            <input type="text" id="regUsername" placeholder="ANVÄNDARNAMN (minst 3)">
            <input type="password" id="regPassword" placeholder="LÖSENORD (minst 4)">
            <button id="doRegisterBtn">📝 SKAPA</button>
            <div id="regMsg" class="error hidden"></div>
        </div>
    </div>

    <!-- Dashboard (syns efter inloggning) -->
    <div id="dashboardView" class="hidden">
        <div class="status-bar">
            <div class="stat">👤 <span id="statUsername"></span></div>
            <div class="stat">⭐ LEVEL <span id="statLevel"></span></div>
            <div class="stat">✨ XP <span id="statXp"></span>/<span id="statXpNext"></span></div>
            <div class="stat">🪙 COINS <span id="statCoins"></span></div>
            <div class="stat">⏱️ COOLDOWN <span id="statCooldown"></span>s</div>
        </div>
        <div>
            <button id="logoutBtn">🚪 LOGGA UT</button>
            <button id="refreshBtn">🔄 UPPDATERA</button>
        </div>
        <hr>
        <h2>📢 SKAPA RYKTE</h2>
        <input type="text" id="rumorTitle" placeholder="TITEL" maxlength="60">
        <textarea id="rumorContent" rows="3" placeholder="Vad är ryktet?" maxlength="500"></textarea>
        <button id="createRumorBtn">🔥 SPRID RYKTE (+10 XP)</button>
        <div id="createMsg" class="error hidden"></div>
        <hr>
        <h2>💬 ALLA RYKTEN</h2>
        <div id="rumorsList"></div>
    </div>
</div>

<script>
    let currentUser = null;

    // Hjälpfunktioner för anrop
    async function apiCall(endpoint, method, body) {
        const res = await fetch(endpoint, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        return await res.json();
    }

    // Uppdatera användarstatistik i dashboard
    async function refreshUserStats() {
        if (!currentUser) return;
        const data = await apiCall('/get_user', 'POST', { username: currentUser });
        document.getElementById('statLevel').innerText = data.level;
        document.getElementById('statXp').innerText = data.xp;
        const nextXp = data.level * 100;
        document.getElementById('statXpNext').innerText = nextXp;
        document.getElementById('statCoins').innerText = data.coins;
        document.getElementById('statCooldown').innerText = data.cooldown_seconds;
        return data;
    }

    // Ladda alla rykten och rendera
    async function loadRumors() {
        const data = await apiCall('/get_rumors', 'GET', {});
        const rumors = data.rumors || [];
        const container = document.getElementById('rumorsList');
        container.innerHTML = '';
        for (let r of rumors) {
            const card = document.createElement('div');
            card.className = 'rumor-card';
            const date = new Date(r.timestamp * 1000).toLocaleString();
            card.innerHTML = `
                <div class="rumor-title">📢 ${escapeHtml(r.title)}</div>
                <div class="rumor-meta">av ${r.author} • ${date} • ❤️ ${r.likes} likes</div>
                <div class="rumor-content">${escapeHtml(r.content)}</div>
                <div>
                    <button class="like-btn" data-id="${r.id}" data-author="${r.author}">❤️ GILLA (+2 XP)</button>
                    <button class="comment-btn" data-id="${r.id}">💬 KOMMENTERA</button>
                </div>
                <div class="comment-section" id="comments-${r.id}">
                    ${r.comments.map(c => `<div class="comment"><strong>${escapeHtml(c.author)}:</strong> ${escapeHtml(c.text)}</div>`).join('')}
                </div>
            `;
            container.appendChild(card);
        }
        // Lägg till event listeners för like/comment
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const rumorId = parseInt(btn.getAttribute('data-id'));
                const result = await apiCall('/like_rumor', 'POST', { rumor_id: rumorId, username: currentUser });
                if (result.success) {
                    if (result.user) updateUserStatsFromData(result.user);
                    loadRumors(); // uppdatera lista
                } else {
                    alert(result.message);
                }
            });
        });
        document.querySelectorAll('.comment-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const rumorId = parseInt(btn.getAttribute('data-id'));
                const commentText = prompt("Skriv din kommentar (max 200 tecken):");
                if (commentText && commentText.trim()) {
                    const result = await apiCall('/comment_rumor', 'POST', { rumor_id: rumorId, username: currentUser, comment: commentText });
                    if (result.success) {
                        if (result.user) updateUserStatsFromData(result.user);
                        loadRumors();
                    } else {
                        alert(result.message);
                    }
                }
            });
        });
    }

    function updateUserStatsFromData(userData) {
        document.getElementById('statLevel').innerText = userData.level;
        document.getElementById('statXp').innerText = userData.xp;
        document.getElementById('statXpNext').innerText = userData.level * 100;
        document.getElementById('statCoins').innerText = userData.coins;
        document.getElementById('statCooldown').innerText = userData.cooldown_seconds;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Inloggning
    document.getElementById('doLoginBtn').addEventListener('click', async () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('loginMsg');
        const res = await apiCall('/login', 'POST', { username, password });
        if (res.success) {
            currentUser = username;
            document.getElementById('statUsername').innerText = username;
            updateUserStatsFromData({ level: res.level, xp: res.xp, coins: res.coins, cooldown_seconds: res.cooldown_seconds });
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            loadRumors();
            // Starta auto-refresh var 10:e sekund
            if (window.refreshInterval) clearInterval(window.refreshInterval);
            window.refreshInterval = setInterval(() => { if (currentUser) loadRumors(); }, 10000);
        } else {
            msgDiv.innerText = res.message;
            msgDiv.classList.remove('hidden');
        }
    });

    // Registrering
    document.getElementById('doRegisterBtn').addEventListener('click', async () => {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const msgDiv = document.getElementById('regMsg');
        if (username.length < 3) { msgDiv.innerText = "Användarnamn minst 3 tecken"; msgDiv.classList.remove('hidden'); return; }
        if (password.length < 4) { msgDiv.innerText = "Lösenord minst 4 tecken"; msgDiv.classList.remove('hidden'); return; }
        const res = await apiCall('/register', 'POST', { username, password });
        if (res.success) {
            alert("Konto skapat! Logga in nu.");
            document.getElementById('showLoginBtn').click();
        } else {
            msgDiv.innerText = res.message;
            msgDiv.classList.remove('hidden');
        }
    });

    // Skapa rykte
    document.getElementById('createRumorBtn').addEventListener('click', async () => {
        const title = document.getElementById('rumorTitle').value.trim();
        const content = document.getElementById('rumorContent').value.trim();
        const msgDiv = document.getElementById('createMsg');
        if (!title || !content) {
            msgDiv.innerText = "Titel och innehåll krävs!";
            msgDiv.classList.remove('hidden');
            return;
        }
        const res = await apiCall('/create_rumor', 'POST', { username: currentUser, title, content });
        if (res.success) {
            document.getElementById('rumorTitle').value = '';
            document.getElementById('rumorContent').value = '';
            msgDiv.classList.add('hidden');
            if (res.user) updateUserStatsFromData(res.user);
            loadRumors();
        } else {
            msgDiv.innerText = res.message;
            msgDiv.classList.remove('hidden');
        }
    });

    // Logga ut
    document.getElementById('logoutBtn').addEventListener('click', () => {
        currentUser = null;
        if (window.refreshInterval) clearInterval(window.refreshInterval);
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
    });

    // Refresh-knapp
    document.getElementById('refreshBtn').addEventListener('click', () => {
        if (currentUser) {
            refreshUserStats();
            loadRumors();
        }
    });

    // Växla mellan login/register formulär
    document.getElementById('showLoginBtn').addEventListener('click', () => {
        document.getElementById('loginFormDiv').classList.remove('hidden');
        document.getElementById('registerFormDiv').classList.add('hidden');
    });
    document.getElementById('showRegisterBtn').addEventListener('click', () => {
        document.getElementById('loginFormDiv').classList.add('hidden');
        document.getElementById('registerFormDiv').classList.remove('hidden');
    });
    // Visa login som standard
    document.getElementById('showLoginBtn').click();
</script>
</body>
</html>
