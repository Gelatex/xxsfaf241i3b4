<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Falun Rykten 2 – 8-bit ryktesmaskin</title>
    <style>
        * {
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        body {
            background: #0a0f0a;
            font-family: 'Courier New', 'MS Gothic', monospace;
            margin: 0;
            padding: 20px;
            color: #b3ffaa;
        }
        /* 8-bit retro container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1a2a1a;
            border: 4px solid #5f9e5f;
            box-shadow: 8px 8px 0 #0a1f0a;
            padding: 16px;
        }
        h1, h2, h3 {
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 0 #0a2a0a;
            letter-spacing: 2px;
        }
        h1 {
            font-size: 2rem;
            background: #2a3a2a;
            display: inline-block;
            padding: 6px 12px;
            border: 2px solid #6fae6f;
            margin-top: 0;
        }
        button, .tab-btn, .rumor-btn {
            background: #2b3b2b;
            border: 2px solid #5f9e5f;
            color: #cfffc0;
            font-family: monospace;
            font-weight: bold;
            font-size: 1rem;
            padding: 6px 12px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #0e2a0e;
            transition: 0.05s linear;
        }
        button:active, .tab-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #0e2a0e;
        }
        input, textarea {
            background: #0f1a0f;
            border: 2px solid #5f9e5f;
            color: #afff9f;
            font-family: monospace;
            font-size: 1rem;
            padding: 8px;
            width: 100%;
            margin-bottom: 12px;
        }
        .rumor-card {
            background: #1e2e1e;
            border: 2px solid #4e8e4e;
            margin: 16px 0;
            padding: 12px;
            box-shadow: 4px 4px 0 #0e1e0e;
        }
        .rumor-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffcc77;
            border-bottom: 1px dashed #7fae7f;
        }
        .rumor-meta {
            font-size: 0.8rem;
            color: #8fbf8f;
            margin: 5px 0;
        }
        .rumor-content {
            margin: 10px 0;
            white-space: pre-wrap;
        }
        .like-comment {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .comment-section {
            margin-top: 12px;
            border-top: 1px solid #4e7e4e;
            padding-top: 8px;
        }
        .comment {
            background: #122212;
            margin: 6px 0;
            padding: 6px;
            font-size: 0.85rem;
        }
        .user-info {
            background: #0e1a0e;
            padding: 8px;
            border: 2px solid #5f9e5f;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .stat {
            background: #1f2f1f;
            padding: 4px 8px;
            margin: 2px;
            display: inline-block;
        }
        .cooldown {
            color: #ffaa66;
        }
        .error {
            color: #ff8866;
            background: #331100;
            padding: 6px;
        }
        .success {
            color: #aaffaa;
        }
        .hidden {
            display: none;
        }
        hr {
            border-color: #4e8e4e;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- Inloggningsvy -->
    <div id="loginView">
        <h1>🐺 FALU RYKTEN 2 🕹️</h1>
        <div class="tab-buttons">
            <button id="showLoginBtn" class="tab-btn active">🔐 LOGGA IN</button>
            <button id="showRegisterBtn" class="tab-btn">✨ SKAPA KONTO</button>
        </div>
        <div id="loginFormDiv">
            <h3>Logga in</h3>
            <input type="text" id="loginUsername" placeholder="Användarnamn"><br>
            <input type="password" id="loginPassword" placeholder="Lösenord"><br>
            <button id="doLoginBtn">🎮 Logga in</button>
            <div id="loginMessage" class="error" style="margin-top:10px"></div>
        </div>
        <div id="registerFormDiv" style="display:none">
            <h3>Skapa konto</h3>
            <input type="text" id="regUsername" placeholder="Användarnamn (minst 3 tecken)"><br>
            <input type="password" id="regPassword" placeholder="Lösenord (minst 4 tecken)"><br>
            <button id="doRegisterBtn">📝 Skapa konto</button>
            <div id="regMessage" class="error" style="margin-top:10px"></div>
        </div>
    </div>

    <!-- Dashboard (syns efter inloggning) -->
    <div id="dashboardView" style="display:none">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <h1>🐺 FALU RYKTEN 2</h1>
            <button id="logoutBtn">🚪 LOGGA UT</button>
        </div>
        <!-- Användarinfo -->
        <div class="user-info" id="userStats">
            <span class="stat">⭐ NIVÅ: <span id="userLevel">1</span></span>
            <span class="stat">✨ XP: <span id="userXp">0</span></span>
            <span class="stat">🪙 MYNT: <span id="userCoins">0</span></span>
            <span class="stat cooldown">⏳ COOLDOWN: <span id="cooldownSec">0</span> s</span>
        </div>

        <!-- Skapa nytt rykte -->
        <div style="background: #1a2a1a; border: 2px solid #5f9e5f; padding: 12px; margin-bottom: 20px;">
            <h3>✍️ SPRID ETT RYKTE</h3>
            <input type="text" id="rumorTitle" placeholder="Titel" maxlength="100">
            <textarea id="rumorContent" placeholder="Vad har du hört?..."></textarea>
            <button id="postRumorBtn">📢 SKICKA RYKTE (+10 XP, 1🪙)</button>
            <div id="rumorPostMessage" class="error" style="margin-top:6px"></div>
        </div>

        <!-- Lista med rykten -->
        <h3>📜 ALLA RYKTEN</h3>
        <div id="rumorsList"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // Globals
    let currentUser = null;
    let rumorsData = [];
    let userProfile = { level: 1, xp: 0, coins: 0, last_rumor_time: 0 };
    let cooldownInterval = null;

    // Hjälpfunktion för fetch (anropar samma server)
    async function apiCall(endpoint, method, body) {
        const opts = {
            method: method,
            headers: { 'Content-Type': 'application/json' }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(endpoint, opts);
        const data = await res.json();
        return { status: res.status, data };
    }

    // Ladda användarprofil
    async function loadUserProfile() {
        if (!currentUser) return;
        const { data } = await apiCall(`/user_data?username=${encodeURIComponent(currentUser)}`, 'GET');
        if (data && typeof data === 'object') {
            userProfile = data;
            document.getElementById('userLevel').innerText = userProfile.level || 1;
            document.getElementById('userXp').innerText = userProfile.xp || 0;
            document.getElementById('userCoins').innerText = userProfile.coins || 0;
            updateCooldownDisplay();
        }
    }

    // Beräkna cooldown (baserat på level)
    function getCooldownSeconds(level) {
        let cd = 60 - (level-1) * 2;
        if (cd < 10) cd = 10;
        return cd;
    }

    function updateCooldownDisplay() {
        const level = userProfile.level || 1;
        const cdSec = getCooldownSeconds(level);
        document.getElementById('cooldownSec').innerText = cdSec;
        // Om vi vill ha nedräkning senare
    }

    // Ladda alla rykten och rendera
    async function loadRumors() {
        const { data } = await apiCall('/rumors', 'GET');
        if (Array.isArray(data)) {
            rumorsData = data;
            renderRumors();
        }
    }

    // Rendera rykten med likes & kommentarer
    function renderRumors() {
        const container = document.getElementById('rumorsList');
        if (!container) return;
        if (rumorsData.length === 0) {
            container.innerHTML = '<div class="rumor-card">Inga rykten ännu. Bli först med att sprida ett!</div>';
            return;
        }
        let html = '';
        for (let r of rumorsData) {
            const dateStr = new Date(r.date).toLocaleString();
            const likedByUser = r.liked_by && r.liked_by.includes(currentUser);
            html += `
                <div class="rumor-card" data-id="${r.id}">
                    <div class="rumor-title">📢 ${escapeHtml(r.title)}</div>
                    <div class="rumor-meta">Av: ${escapeHtml(r.author)} | ${dateStr}</div>
                    <div class="rumor-content">${escapeHtml(r.content)}</div>
                    <div class="like-comment">
                        <button class="like-btn" data-id="${r.id}">❤️ ${r.likes || 0} gilla</button>
                        <span>💬 ${(r.comments || []).length} kommentarer</span>
                    </div>
                    <div class="comment-section">
                        <div class="comment-list" id="comments-${r.id}">
            `;
            // Visa befintliga kommentarer
            const comments = r.comments || [];
            for (let c of comments) {
                const commentDate = new Date(c.date).toLocaleString();
                html += `<div class="comment"><strong>${escapeHtml(c.user)}</strong> ${escapeHtml(c.text)}<br><span style="font-size:0.7rem">${commentDate}</span></div>`;
            }
            html += `
                        </div>
                        <div style="display:flex; gap:6px; margin-top:8px;">
                            <input type="text" id="commentInput-${r.id}" placeholder="Skriv kommentar..." style="flex:1">
                            <button class="comment-btn" data-id="${r.id}">Skicka</button>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        // Binda events för like och kommentar (delegation)
        container.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const rumorId = parseInt(btn.getAttribute('data-id'));
                await likeRumor(rumorId);
            });
        });
        container.querySelectorAll('.comment-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const rumorId = parseInt(btn.getAttribute('data-id'));
                const input = document.getElementById(`commentInput-${rumorId}`);
                const text = input.value.trim();
                if (text) {
                    await commentRumor(rumorId, text);
                    input.value = '';
                }
            });
        });
    }

    async function likeRumor(rumorId) {
        const { data, status } = await apiCall('/like_rumor', 'POST', { username: currentUser, rumor_id: rumorId });
        if (data.success) {
            await loadRumors();
            await loadUserProfile(); // uppdatera XP
        } else {
            showTemporaryMessage(data.message || 'Kunde inte gilla', true);
        }
    }

    async function commentRumor(rumorId, text) {
        const { data } = await apiCall('/comment_rumor', 'POST', { username: currentUser, rumor_id: rumorId, text });
        if (data.success) {
            await loadRumors();
            await loadUserProfile(); // XP för kommentar
        } else {
            alert(data.message);
        }
    }

    async function createRumor(title, content) {
        const { data, status } = await apiCall('/create_rumor', 'POST', { username: currentUser, title, content });
        if (data.success) {
            document.getElementById('rumorTitle').value = '';
            document.getElementById('rumorContent').value = '';
            await loadRumors();
            await loadUserProfile();
            document.getElementById('rumorPostMessage').innerText = '✅ Rykte publicerat! +10 XP, +1 🪙';
            document.getElementById('rumorPostMessage').className = 'success';
            setTimeout(() => {
                document.getElementById('rumorPostMessage').innerText = '';
            }, 3000);
        } else {
            document.getElementById('rumorPostMessage').innerText = data.message || 'Fel vid publicering';
            document.getElementById('rumorPostMessage').className = 'error';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    function showTemporaryMessage(msg, isError) {
        const msgDiv = document.getElementById('rumorPostMessage');
        if (msgDiv) {
            msgDiv.innerText = msg;
            msgDiv.className = isError ? 'error' : 'success';
            setTimeout(() => { msgDiv.innerText = ''; }, 3000);
        } else {
            alert(msg);
        }
    }

    // Inloggning
    async function login(username, password) {
        const { data, status } = await apiCall('/login', 'POST', { username, password });
        if (data.success) {
            currentUser = username;
            localStorage.setItem('falunUser', username);
            await loadUserProfile();
            await loadRumors();
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            startCooldownTimer();
        } else {
            document.getElementById('loginMessage').innerText = data.message;
        }
    }

    async function register(username, password) {
        const { data } = await apiCall('/register', 'POST', { username, password });
        if (data.success) {
            document.getElementById('regMessage').innerText = 'Konto skapat! Logga in nu.';
            document.getElementById('regMessage').className = 'success';
            setTimeout(() => {
                document.getElementById('showLoginBtn').click();
            }, 1500);
        } else {
            document.getElementById('regMessage').innerText = data.message;
            document.getElementById('regMessage').className = 'error';
        }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('falunUser');
        if (cooldownInterval) clearInterval(cooldownInterval);
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginMessage').innerText = '';
    }

    function startCooldownTimer() {
        if (cooldownInterval) clearInterval(cooldownInterval);
        cooldownInterval = setInterval(async () => {
            if (currentUser) {
                await loadUserProfile();
            }
        }, 2000);
    }

    // UI-flikar för login/register
    document.getElementById('showLoginBtn').addEventListener('click', () => {
        document.getElementById('loginFormDiv').style.display = 'block';
        document.getElementById('registerFormDiv').style.display = 'none';
        document.getElementById('showLoginBtn').classList.add('active');
        document.getElementById('showRegisterBtn').classList.remove('active');
    });
    document.getElementById('showRegisterBtn').addEventListener('click', () => {
        document.getElementById('loginFormDiv').style.display = 'none';
        document.getElementById('registerFormDiv').style.display = 'block';
        document.getElementById('showRegisterBtn').classList.add('active');
        document.getElementById('showLoginBtn').classList.remove('active');
    });
    document.getElementById('doLoginBtn').addEventListener('click', () => {
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value;
        login(u, p);
    });
    document.getElementById('doRegisterBtn').addEventListener('click', () => {
        const u = document.getElementById('regUsername').value.trim();
        const p = document.getElementById('regPassword').value;
        register(u, p);
    });
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('postRumorBtn').addEventListener('click', () => {
        const title = document.getElementById('rumorTitle').value.trim();
        const content = document.getElementById('rumorContent').value.trim();
        if (!title || !content) {
            document.getElementById('rumorPostMessage').innerText = 'Titel och innehåll krävs';
            return;
        }
        createRumor(title, content);
    });

    // Kolla om användaren redan är inloggad (session)
    const savedUser = localStorage.getItem('falunUser');
    if (savedUser) {
        currentUser = savedUser;
        // Verifiera att användaren fortfarande finns (genom att hämta user_data)
        apiCall(`/user_data?username=${encodeURIComponent(currentUser)}`, 'GET').then(({ data }) => {
            if (data && typeof data === 'object' && !data.error) {
                userProfile = data;
                loadRumors().then(() => {
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('dashboardView').style.display = 'block';
                    startCooldownTimer();
                    loadUserProfile();
                });
            } else {
                logout();
            }
        }).catch(() => logout());
    } else {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('dashboardView').style.display = 'none';
    }
</script>
</body>
</html>
